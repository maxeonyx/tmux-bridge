name: CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to validate and integrate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  ready:
    name: Ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate pull request head and base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          test "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = OPEN
          test "$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName)" = main
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"

      - name: Install tmux and fish
        run: sudo apt-get update && sudo apt-get install -y tmux fish

      - name: Lint GitHub Actions with actionlint
        uses: raven-actions/actionlint@v2

      - name: Prepare cargo-ratchet source
        run: git clone --depth=1 https://github.com/maxeonyx/tdd-ratchet-rs "$RUNNER_TEMP/tdd-ratchet"

      - name: Require a fresh release version
        run: |
          tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists; bump package.version before integration."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - name: Install test runners
        run: |
          cargo install --path "$RUNNER_TEMP/tdd-ratchet" --locked
          cargo install cargo-nextest --locked
      - name: Run tests through the ratchet
        run: cargo ratchet

  build:
    name: Build (${{ matrix.target }})
    needs: ready
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: tb
            asset: tb-x86_64-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: tb.exe
            asset: tb-x86_64-windows.exe
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}
      - if: runner.os == 'Windows'
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 1

  integrate:
    name: Merge
    needs: [ready, build]
    runs-on: ubuntu-latest
    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Enable auto-merge and wait for the merge commit
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --auto --delete-branch
          merge_sha=""
          for _ in $(seq 1 60); do
            state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [ "$state" = MERGED ]; then
              merge_sha="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
              break
            fi
            test "$state" = OPEN
            sleep 5
          done
          test -n "$merge_sha"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$merge_sha" \
            -f state=pending -f context=integrated-ci \
            -f description='Publishing validated integration artifacts' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release:
    name: Release
    needs: [build, integrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the validated artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
        run: |
          tag="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          gh release create "$tag" --title "$tag" --generate-notes --target "$MERGE_SHA" artifacts/*/*

  pages:
    name: Pages
    needs: [build, integrate, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.integrate.outputs.merge_sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: actions/configure-pages@v6
      - name: Prepare site content
        run: |
          mkdir -p _site/releases
          cp -R docs/. _site/
          cp artifacts/*/* _site/releases/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  integrated:
    name: Integrated
    if: always() && needs.integrate.result == 'success'
    needs: [integrate, release, pages]
    runs-on: ubuntu-latest
    steps:
      - name: Record the exact merge commit result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ needs.integrate.outputs.merge_sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
        run: |
          state=failure
          if [ "$RELEASE_RESULT" = success ] && [ "$PAGES_RESULT" = success ]; then
            state=success
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$MERGE_SHA" \
            -f state="$state" -f context=integrated-ci \
            -f description='One-run integration and publication result' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          test "$state" = success
